services:
  odoo_test_db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always
    volumes:
      - ./postgresql:/var/lib/postgresql
    networks:
      - odoo_test_db

  odoo_test:
    image: odoo:19
    user: root  # Убирает PermissionDenied для /var/lib/odoo/sessions
    depends_on:
      - odoo_test_db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo_test.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.odoo_test.entrypoints=websecure"
      - "traefik.http.routers.odoo_test.tls.certresolver=le"
      - "traefik.http.services.odoo_test.loadbalancer.server.port=8069"
      - "traefik.docker.network=traefik"
    tty: true
    environment:
      - HOST=odoo_test_db
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}  # Исправлено: Odoo требует PASSWORD, а не POSTGRES_PASSWORD
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
      - ./odoo-data:/var/lib/odoo
    restart: always
    networks:
      - odoo_test_db
      - traefik

networks:
  odoo_test_db:
    driver: bridge
  traefik:
    external: true

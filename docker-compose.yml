services:
  odoo_test_db:
    image: postgres:16
    user: root
    
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always
    volumes:
      - ./postgresql:/var/lib/postgresql
    networks:
      - odoo_test_db
    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U odoo"]
          interval: 5s
          timeout: 5s
          retries: 10

  odoo_test:
    image: odoo:19
    user: root
    depends_on:
      odoo_test_db:
        condition: service_healthy 
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo_test.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.odoo_test.entrypoints=websecure"
      - "traefik.http.routers.odoo_test.tls.certresolver=le"
      - "traefik.http.services.odoo_test.loadbalancer.server.port=8069"
      - "traefik.docker.network=traefik"
    tty: true
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
      - ./odoo-data:/var/lib/odoo
    restart: always
    networks:
      - odoo_test_db
      - traefik


networks:
  odoo_test_db:
    driver: bridge
  traefik:
    external: true

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 320">
    <defs>
        <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#F7CE7B"/>
            <stop offset="55%"  stop-color="#E8A93D"/>
            <stop offset="100%" stop-color="#C68820"/>
        </linearGradient>
        <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>
        <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#E8C893"/>
            <stop offset="100%" stop-color="#B89465"/>
        </linearGradient>
    </defs>

    <!-- Cap -->
    <rect x="48" y="4" width="44" height="38" rx="3" fill="url(#cap)"/>
    <rect x="48" y="34" width="44" height="8" fill="#9C7B4F" opacity="0.6"/>

    <!-- Neck -->
    <rect x="54" y="42" width="32" height="12" fill="#E8C893"/>

    <!-- Body -->
    <rect x="20" y="54" width="100" height="248" rx="10" fill="url(#bottle)"/>
    <rect x="28" y="64" width="14" height="228" rx="6" fill="url(#hl)"/>

    <!-- Label -->
    <rect x="32" y="118" width="76" height="124" fill="#FBF5EA" opacity="0.95"/>
    <text x="70" y="146" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="11" font-weight="500" fill="#6B3E1F" letter-spacing="2">HAIR</text>
    <text x="70" y="162" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="11" font-weight="500" fill="#6B3E1F" letter-spacing="2">FORMULA</text>
    <line x1="48" y1="172" x2="92" y2="172" stroke="#B89465" stroke-width="0.4"/>
    <text x="70" y="192" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="8" font-style="italic" fill="#8C6238">restorative ritual</text>
    <text x="70" y="207" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="7" font-style="italic" fill="#8C6238">№ 01</text>
    <line x1="55" y1="220" x2="85" y2="220" stroke="#B89465" stroke-width="0.3"/>
    <text x="70" y="232" text-anchor="middle" font-family="Manrope, sans-serif" font-size="5" fill="#8C6238" letter-spacing="0.8">100ML / 3.4 FL OZ</text>
</svg>

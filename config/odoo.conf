[options]
; ----------------------------------------------------------------------------
; Odoo Community configuration (development)
; ----------------------------------------------------------------------------

; Master password protecting the database manager (/web/database/manager).
; CHANGE THIS before exposing the instance anywhere beyond localhost.
admin_passwd = admin

; Database connection — values are also supplied via environment variables in
; docker-compose.yml (HOST/USER/PASSWORD), repeated here for clarity.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Where Odoo looks for modules. /mnt/extra-addons is the mounted ./addons dir
; holding our custom module(s); the core/base addons ship inside the image.
addons_path = /mnt/extra-addons

; Filestore / attachments (ir.attachment) live under this data dir, persisted
; via the odoo-data volume.
data_dir = /var/lib/odoo

; Development conveniences ----------------------------------------------------
; Auto-reload Python and re-read assets on change for faster iteration.
dev_mode = reload,qweb,xml

; Listen on all interfaces inside the container (mapped to host in compose).
http_port = 8069

; Logging
log_level = info

; Workers: 0 keeps everything in a single process (simplest for dev / the
; auto-reloader). Raise for production.
workers = 0

; Restrict who can create/drop databases via the web UI in dev.
list_db = True
